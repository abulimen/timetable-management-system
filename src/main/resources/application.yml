spring:
  application:
    name: timetable-engine
  
  datasource:
    url: jdbc:mysql://localhost:3306/timetable_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # OPTIMIZATION: Connection pool tuning for better async performance
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # OPTIMIZATION: Disable open-in-view for better performance
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # OPTIMIZATION: Batch updates for faster persistence
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Solver runtime tuning
solver:
  engine: ${SOLVER_ENGINE:TIMEFOLD}  # TIMEFOLD, CPSAT, or HYBRID
  performance:
    move-thread-count: ${SOLVER_MOVE_THREAD_COUNT:4}
    environment-mode: ${SOLVER_ENVIRONMENT_MODE:NON_REPRODUCIBLE}
    parallel-solver-count: ${SOLVER_PARALLEL_SOLVER_COUNT:1}
  feasibility:
    run-on-dirty-only: ${SOLVER_FEASIBILITY_RUN_ON_DIRTY_ONLY:true}
  persistence:
    checkpoint-enabled: ${SOLVER_PERSISTENCE_CHECKPOINT_ENABLED:false}
    checkpoint-min-interval-ms: ${SOLVER_PERSISTENCE_CHECKPOINT_MIN_INTERVAL_MS:120000}
    checkpoint-every-n-improvements: ${SOLVER_PERSISTENCE_CHECKPOINT_EVERY_N_IMPROVEMENTS:0}

# CP-SAT Solver Configuration (Google OR-Tools)
cpsat:
  solver:
    time-limit-seconds: ${CPSAT_TIME_LIMIT_SECONDS:12000}
    num-workers: ${CPSAT_NUM_WORKERS:8}
    enabled: ${CPSAT_ENABLED:true}
    feasibility-only: ${CPSAT_FEASIBILITY_ONLY:true}  # Skip soft constraints for faster solving

# Hybrid CP-SAT + Timefold Solver Configuration
hybrid:
  cpsat:
    time-limit-seconds: ${HYBRID_CPSAT_TIME_LIMIT_SECONDS:300}
    num-workers: ${HYBRID_NUM_WORKERS:8}
  timefold:
    time-limit-seconds: ${HYBRID_TIMEFOLD_TIME_LIMIT_SECONDS:600}
  # Benders-style decomposition: CP-SAT timeslot-only + per-timeslot room matching
  decomposed:
    enabled: ${HYBRID_DECOMPOSED_ENABLED:true}
    max-benders-iterations: ${HYBRID_MAX_BENDERS_ITERATIONS:3}

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Logging - reduced for performance
logging:
  level:
    ai.timefold: DEBUG
    ai.timefold.solver.core.impl.solver: DEBUG
    ai.timefold.solver.core.impl.localsearch: DEBUG
    com.university.timetable: INFO
    com.university.timetable.controller.SolverController: ${LOG_LEVEL_SOLVER_CONTROLLER:INFO}
    com.university.timetable.service.SolverService: ${LOG_LEVEL_SOLVER_SERVICE:INFO}
    com.university.timetable.service.InfeasibilityChecker: ${LOG_LEVEL_INFEASIBILITY_CHECKER:INFO}
    com.university.timetable.service.TimeslotService: ${LOG_LEVEL_TIMESLOT_SERVICE:INFO}
    com.university.timetable.service.SolutionSaver: ${LOG_LEVEL_SOLUTION_SAVER:INFO}
    com.university.timetable.solver.TimetableConstraintProvider: ${LOG_LEVEL_CONSTRAINT_PROVIDER:INFO}
    com.university.timetable.security: INFO
    org.hibernate.SQL: WARN

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-only-change-me-to-a-secure-env-secret}
  access-token-expiration: 3600000      # 1 hour in milliseconds
  refresh-token-expiration: 604800000  # 7 days in milliseconds

# Brevo (Sendinblue) Email Configuration
brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: noreply@babcock.edu.ng
  sender-name: University Timetable

# Application Settings
app:
  name: University Timetable System
  login-url: ${APP_LOGIN_URL:http://localhost:4200/login}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200}
