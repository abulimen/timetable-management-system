spring:
  application:
    name: timetable-engine
  
  datasource:
    url: jdbc:mysql://localhost:3306/timetable_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # OPTIMIZATION: Connection pool tuning for better async performance
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # OPTIMIZATION: Disable open-in-view for better performance
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # OPTIMIZATION: Batch updates for faster persistence
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# OptaPlanner Configuration
# FULLY OPTIMIZED with:
# - Multi-threaded solving (AUTO = all CPU cores)
# - Combined acceptors (Tabu + Late Acceptance)
# - FIRST_FIT_DECREASING construction heuristic
optaplanner:
  solver-config-xml: solver-config.xml
  solver:
    # OPTIMIZATION: Use all CPU cores for parallel move evaluation
    move-thread-count: AUTO

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Logging - reduced for performance
logging:
  level:
    org.optaplanner: INFO
    org.optaplanner.core.impl.solver: INFO
    org.optaplanner.core.impl.localsearch: INFO
    com.university.timetable: INFO
    org.hibernate.SQL: WARN
