spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

solver:
  performance:
    move-thread-count: ${SOLVER_MOVE_THREAD_COUNT:4}
    environment-mode: ${SOLVER_ENVIRONMENT_MODE:NON_REPRODUCIBLE}
    parallel-solver-count: ${SOLVER_PARALLEL_SOLVER_COUNT:1}
  feasibility:
    run-on-dirty-only: ${SOLVER_FEASIBILITY_RUN_ON_DIRTY_ONLY:true}
  persistence:
    checkpoint-enabled: ${SOLVER_PERSISTENCE_CHECKPOINT_ENABLED:false}
    checkpoint-min-interval-ms: ${SOLVER_PERSISTENCE_CHECKPOINT_MIN_INTERVAL_MS:120000}
    checkpoint-every-n-improvements: ${SOLVER_PERSISTENCE_CHECKPOINT_EVERY_N_IMPROVEMENTS:0}

logging:
  level:
    ai.timefold: INFO
    ai.timefold.solver.core.impl.solver: INFO
    ai.timefold.solver.core.impl.localsearch: INFO
    com.university.timetable: INFO
    com.university.timetable.security: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME:University Timetable}

app:
  login-url: ${APP_LOGIN_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
