spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    org.optaplanner: INFO
    org.optaplanner.core.impl.solver: INFO
    org.optaplanner.core.impl.localsearch: INFO
    com.university.timetable: INFO
    com.university.timetable.security: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME:University Timetable}

app:
  login-url: ${APP_LOGIN_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
