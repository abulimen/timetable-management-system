spring:
  application:
    name: timetable-engine-test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  flyway:
    enabled: false

# Timefold solver test config
timefold:
  solver-config-xml: solver-config.xml

logging:
  level:
    root: WARN
    com.university.timetable: INFO
